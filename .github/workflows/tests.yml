name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify analytical decision models
        run: node --test tests/*.test.mjs labs/*.test.mjs labs/*/*.test.mjs
      - name: Verify pinned official filing data
        run: python3 scripts/finance_filings/build.py --check
      - name: Verify financial statement selection and calculations
        run: python3 -m unittest discover -s scripts/finance_filings -p 'test_*.py' -v
  crm-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline analysis dependencies
        run: python -m pip install -r scripts/crm_campaign_audit/requirements.txt
      - name: Verify frozen source, model and held-out records
        run: python -m unittest discover -s scripts/crm_campaign_audit -p 'test_*.py' -v
      - name: Reproduce the published artifact from saved parameters
        run: python scripts/crm_campaign_audit/build.py --check
